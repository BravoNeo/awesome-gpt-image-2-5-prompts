name: Generate catalog
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: generate-catalog
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Always build the latest trusted main, including when pushes queue.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: |
          python3 scripts/catalog.py
          python3 -m unittest discover -s tests -v
          python3 scripts/generate.py
          python3 scripts/generate.py --check
      - name: Commit generated outputs if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- README.md README.zh-CN.md references export
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerate prompt catalog'
          git -c credential.helper='!gh auth git-credential' push origin HEAD:main
